<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AP MDM Entitlement Search</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

.mdm-container{
    width:100%;
    max-width:650px;
    margin:auto;
    background:#fff;
    border:2px solid #2563eb;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header{
    padding:14px 12px;
    text-align:center;
    color:#fff;
    font-size:21px;
    font-weight:bold;
    background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
}

.form-area{
    padding:18px;
}

label{
    display:block;
    font-weight:bold;
    margin:8px 0 5px;
    color:#1e293b;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.12);
}

.search-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:9px;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#2563eb,#059669);
}

.search-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

.result{
    display:none;
    margin:0 18px 18px;
    border:2px solid #16a34a;
    border-radius:12px;
    overflow:hidden;
}

.school-name{
    padding:13px;
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(90deg,#16a34a,#0ea5e9);
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 15px;
    border-top:1px solid #e2e8f0;
    font-weight:bold;
}

.item span:last-child{
    font-size:17px;
}

.rice span:last-child{color:#2563eb}
.jaggery span:last-child{color:#dc2626}
.ragi span:last-child{color:#16a34a}

.download-btn{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 18px;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:500px){
    body{padding:8px}
    .form-area{padding:13px}
    .result{margin:0 13px 13px}
    .download-btn{
        width:calc(100% - 26px);
        margin:0 13px 13px;
    }
}
</style>
</head>

<body>

<div class="mdm-container">

    <div class="header">
        AP MDM SCHOOL ENTITLEMENT
    </div>

    <div class="form-area">

        <label>UDISE / Institute Code</label>
        <input
            type="text"
            id="school"
            placeholder="Enter UDISE Code"
            autocomplete="off"
        >

        <label>Month</label>
        <select id="month">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8" selected>September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
        </select>

        <label>Year</label>
        <select id="year">
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
        </select>

        <button class="search-btn" id="searchBtn" onclick="searchSchool()">
            🔍 SEARCH DETAILS
        </button>

        <div class="status" id="status"></div>

    </div>

    <div class="result" id="result">

        <div class="school-name" id="schoolName"></div>

        <div class="item rice">
            <span>🍚 Fine Rice</span>
            <span id="riceValue">0 KG</span>
        </div>

        <div class="item jaggery">
            <span>🟠 Jaggery</span>
            <span id="jaggeryValue">0 KG</span>
        </div>

        <div class="item ragi">
            <span>🟢 Ragi Powder</span>
            <span id="ragiValue">0 KG</span>
        </div>

    </div>

    <button
        class="download-btn"
        id="downloadBtn"
        onclick="window.print()"
        style="display:none;">
        📄 DOWNLOAD / PRINT PDF
    </button>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzc0Y7OLlQIQfXOG4Y0BB0D1hfvDEdYxudUfugeCvXI_v4fk_m2nexJZufiefdRGMLk6A/exec";


function num(value){
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
}


/* -----------------------------
   CALCULATIONS
----------------------------- */

function calculateRice(data){

    const units =
        num(data?.rice?.["06_08"]) +
        num(data?.rice?.["09_10"]);

    return units * 25;
}


function calculateJaggery(data){

    return (
        num(data?.jaggery?.["06_08"]) +
        num(data?.jaggery?.["09_10"])
    );
}


function calculateRagi(data){

    return (
        num(data?.ragi?.["06_08"]) +
        num(data?.ragi?.["09_10"])
    );
}


/* -----------------------------
   SEARCH
----------------------------- */

async function searchSchool(){

    const schoolInput =
        document.getElementById("school");

    const month =
        document.getElementById("month").value;

    const year =
        document.getElementById("year").value;

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const searchBtn =
        document.getElementById("searchBtn");

    const downloadBtn =
        document.getElementById("downloadBtn");


    /* IMPORTANT:
       Read exactly what the user entered.
       No school code is hard-coded here.
    */

    const school =
        schoolInput.value.trim();


    if(!school){

        status.style.color="#dc2626";
        status.textContent="Please enter UDISE / Institute Code.";

        result.style.display="none";
        downloadBtn.style.display="none";

        return;
    }


    searchBtn.disabled=true;

    status.style.color="#2563eb";
    status.textContent="Searching official MDM data...";

    result.style.display="none";
    downloadBtn.style.display="none";


    try{

        const url =
            API_URL +
            "?action=search" +
            "&school=" +
            encodeURIComponent(school) +
            "&month=" +
            encodeURIComponent(month) +
            "&year=" +
            encodeURIComponent(year) +
            "&_=" +
            Date.now();


        const response =
            await fetch(url,{
                method:"GET",
                cache:"no-store"
            });


        if(!response.ok){
            throw new Error("Server error: " + response.status);
        }


        const data =
            await response.json();


        console.log("MDM RESPONSE:",data);


        if(data.status !== "SUCCESS"){

            throw new Error(
                data.message ||
                "School details not found."
            );
        }


        /* -----------------------------
           DISPLAY ONLY RETURNED SCHOOL
        ----------------------------- */

        document.getElementById("schoolName")
            .textContent =
            data.school_name || "School";


        document.getElementById("riceValue")
            .textContent =
            calculateRice(data) + " KG";


        document.getElementById("jaggeryValue")
            .textContent =
            calculateJaggery(data) + " KG";


        document.getElementById("ragiValue")
            .textContent =
            calculateRagi(data) + " KG";


        result.style.display="block";

        downloadBtn.style.display="block";

        status.style.color="#16a34a";
        status.textContent="Details found successfully.";


    }catch(error){

        console.error(error);

        result.style.display="none";
        downloadBtn.style.display="none";

        status.style.color="#dc2626";

        status.textContent =
            error.message ||
            "Unable to retrieve school details.";

    }finally{

        searchBtn.disabled=false;

    }
}


/* Allow ENTER key */

document.getElementById("school")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        searchSchool();
    }

});

</script>


<style>

@media print{

    body{
        background:white;
        padding:0;
    }

    .mdm-container{
        max-width:650px;
        border:0;
        box-shadow:none;
    }

    .header,
    .form-area,
    .status,
    .download-btn{
        display:none !important;
    }

    .result{
        display:block !important;
        margin:20px auto;
        border:2px solid #000;
    }

}

</style>

</body>
</html>
