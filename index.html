<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AP MDM School Entitlement</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
}

/* MAIN BOX */
.mdm-container{
    width:100%;
    max-width:580px;
    margin:20px auto;
    background:#ffffff;
    border:1px solid #dbe4f0;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(15,23,42,.08);
}

/* HEADER */
.header{
    padding:13px 10px;
    text-align:center;
    color:#ffffff;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
    background:linear-gradient(90deg,#1d4ed8,#2563eb);
}

/* FORM */
.form-area{
    padding:16px;
}

label{
    display:block;
    margin:7px 0 5px;
    color:#334155;
    font-size:14px;
    font-weight:700;
}

input,
select{
    width:100%;
    height:42px;
    padding:9px 11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#ffffff;
    color:#0f172a;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.10);
}

/* SEARCH BUTTON */
.search-btn{
    width:100%;
    height:42px;
    margin-top:14px;
    border:0;
    border-radius:7px;
    background:#2563eb;
    color:#ffffff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.search-btn:hover{
    background:#1d4ed8;
}

.search-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

/* STATUS */
.status{
    min-height:20px;
    margin-top:10px;
    text-align:center;
    font-size:13px;
    font-weight:600;
}

.loading-dot{
    display:inline-block;
    width:6px;
    height:6px;
    margin-left:4px;
    border-radius:50%;
    background:#2563eb;
    animation:loading 1s infinite;
}

@keyframes loading{
    0%,100%{
        opacity:.25;
    }
    50%{
        opacity:1;
    }
}


/* RESULT BOX */
.result{
    display:none;
    margin:0 16px 14px;
    border:1px solid #dbe4f0;
    border-radius:10px;
    overflow:hidden;
    background:#ffffff;
}

/* SCHOOL NAME */
.school-name{
    padding:12px 10px;
    text-align:center;
    color:#ffffff;
    background:#059669;
    font-size:17px;
    font-weight:700;
}

/* RESULT ROW */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:45px;
    padding:10px 13px;
    border-top:1px solid #e5e7eb;
    font-size:14px;
    font-weight:700;
}

.item span:last-child{
    font-size:16px;
    font-weight:800;
}

.rice span:last-child{
    color:#2563eb;
}

.jaggery span:last-child{
    color:#dc2626;
}

.ragi span:last-child{
    color:#059669;
}


/* CHECK ANOTHER SCHOOL */
.another-btn{
    display:none;
    width:calc(100% - 32px);
    height:40px;
    margin:0 16px 16px;
    border:1px solid #2563eb;
    border-radius:7px;
    background:#ffffff;
    color:#2563eb;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.another-btn:hover{
    background:#eff6ff;
}


/* PDF BUTTON */
.download-btn{
    display:none;
    width:calc(100% - 32px);
    height:40px;
    margin:0 16px 10px;
    border:0;
    border-radius:7px;
    background:#111827;
    color:#ffffff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}


/* MOBILE */
@media(max-width:500px){

    body{
        padding:7px;
    }

    .mdm-container{
        margin:8px auto;
        border-radius:10px;
    }

    .header{
        font-size:17px;
        padding:12px 8px;
    }

    .form-area{
        padding:13px;
    }

    .result{
        margin:0 13px 12px;
    }

    .another-btn{
        width:calc(100% - 26px);
        margin:0 13px 13px;
    }

    .download-btn{
        width:calc(100% - 26px);
        margin:0 13px 9px;
    }
}


/* PRINT */
@media print{

    body{
        padding:0;
        background:#ffffff;
    }

    .mdm-container{
        max-width:650px;
        margin:20px auto;
        border:0;
        box-shadow:none;
    }

    .header,
    .form-area,
    .status,
    .another-btn,
    .download-btn{
        display:none !important;
    }

    .result{
        display:block !important;
        margin:20px auto;
        border:2px solid #000;
    }

}
</style>
</head>


<body>

<div class="mdm-container">

    <!-- HEADER -->

    <div class="header">
        AP MDM SCHOOL ENTITLEMENT
    </div>


    <!-- FORM -->

    <div class="form-area">

        <label>UDISE / Institute Code</label>

        <input
            type="text"
            id="school"
            placeholder="Enter UDISE Code"
            inputmode="numeric"
            autocomplete="off"
        >


        <label>Month</label>

        <select id="month">

            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8" selected>September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>

        </select>


        <label>Year</label>

        <select id="year">

            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>

        </select>


        <!-- SEARCH -->

        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchSchool()">

            🔍 SEARCH DETAILS

        </button>


        <div
            class="status"
            id="status">
        </div>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">

        <div
            class="school-name"
            id="schoolName">
        </div>


        <div class="item rice">

            <span>🍚 Fine Rice</span>

            <span id="riceValue">
                0 KG
            </span>

        </div>


        <div class="item jaggery">

            <span>🟠 Jaggery</span>

            <span id="jaggeryValue">
                0 KG
            </span>

        </div>


        <div class="item ragi">

            <span>🟢 Ragi Powder</span>

            <span id="ragiValue">
                0 KG
            </span>

        </div>

    </div>


    <!-- CHECK ANOTHER SCHOOL -->

    <button
        class="another-btn"
        id="anotherBtn"
        onclick="checkAnotherSchool()">

        🔄 CHECK ANOTHER SCHOOL

    </button>


    <!-- PDF -->

    <button
        class="download-btn"
        id="downloadBtn"
        onclick="window.print()">

        📄 DOWNLOAD / PRINT PDF

    </button>

</div>


<script>

/* =========================================================
   WORKING APPS SCRIPT URL
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw3OiS5VGG3J40uGoSsQJrnwqyKN5veUOCe3vdG0AoqsMlsm36Ny-E0FEd2fX6QGvVIVA/exec";


/* =========================================================
   NUMBER
========================================================= */

function num(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =========================================================
   FINE RICE
   API gives 25 KG units
========================================================= */

function calculateRice(data){

    /* Normal backend response */

    if(data && data.rice){

        return (
            num(data.rice["01_05"]) +
            num(data.rice["06_08"]) +
            num(data.rice["09_10"]) +
            num(data.rice["11_12"])
        ) * 25;

    }


    /* Fallback if raw dynamicFields are returned */

    const rice =
        data?.dynamicFields?.f_fine_rice_25_kg;

    if(rice){

        return (
            num(rice.requirement_01_5) +
            num(rice.requirement_06_08) +
            num(rice.requirement_09_10) +
            num(rice.requirement_11_12)
        ) * 25;

    }

    return 0;

}


/* =========================================================
   JAGGERY
========================================================= */

function calculateJaggery(data){

    /* Normal backend response */

    if(data && data.jaggery){

        return (
            num(data.jaggery["01_05"]) +
            num(data.jaggery["06_08"]) +
            num(data.jaggery["09_10"]) +
            num(data.jaggery["11_12"])
        );

    }


    /* Fallback */

    const jaggery =
        data?.dynamicFields?.jaggery_1_kg;

    if(jaggery){

        return (
            num(jaggery.requirement_01_5) +
            num(jaggery.requirement_06_08) +
            num(jaggery.requirement_09_10) +
            num(jaggery.requirement_11_12)
        );

    }

    return 0;

}


/* =========================================================
   RAGI POWDER
========================================================= */

function calculateRagi(data){

    /*
       FIRST:
       Read the normal simplified Apps Script response.
    */

    if(data && data.ragi){

        const value =
            num(data.ragi["01_05"]) +
            num(data.ragi["06_08"]) +
            num(data.ragi["09_10"]) +
            num(data.ragi["11_12"]);

        /*
           If a real value exists, use it.
        */

        if(value > 0){

            return value;

        }

    }


    /*
       SECOND:
       Read the original official API structure
       if it is available.
    */

    const ragi =
        data?.dynamicFields?.ragipowder_1kg;

    if(ragi){

        return (
            num(ragi.requirement_01_5) +
            num(ragi.requirement_06_08) +
            num(ragi.requirement_09_10) +
            num(ragi.requirement_11_12)
        );

    }


    /*
       THIRD:
       Support alternate spelling if returned.
    */

    const alternate =
        data?.dynamicFields?.ragi_powder_1kg;

    if(alternate){

        return (
            num(alternate.requirement_01_5) +
            num(alternate.requirement_06_08) +
            num(alternate.requirement_09_10) +
            num(alternate.requirement_11_12)
        );

    }


    return 0;

}


/* =========================================================
   SEARCH SCHOOL
========================================================= */

async function searchSchool(){

    const schoolInput =
        document.getElementById("school");

    const month =
        document.getElementById("month").value;

    const year =
        document.getElementById("year").value;

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const searchBtn =
        document.getElementById("searchBtn");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const anotherBtn =
        document.getElementById("anotherBtn");

    const school =
        schoolInput.value.trim();


    /* =====================================================
       VALIDATION
    ===================================================== */

    if(!school){

        status.style.color="#dc2626";

        status.textContent =
            "Please enter UDISE / Institute Code.";

        schoolInput.focus();

        return;

    }


    if(!/^\d{8,15}$/.test(school)){

        status.style.color="#dc2626";

        status.textContent =
            "Please enter a valid UDISE / Institute Code.";

        schoolInput.focus();

        return;

    }


    /* =====================================================
       START SEARCH
    ===================================================== */

    searchBtn.disabled=true;

    searchBtn.textContent =
        "⏳ SEARCHING...";

    result.style.display="none";

    downloadBtn.style.display="none";

    anotherBtn.style.display="none";

    status.style.color="#2563eb";

    status.innerHTML =
        "Reading official MDM data" +
        '<span class="loading-dot"></span>';


    try{

        /* =================================================
           API URL
        ================================================= */

        const url =
            API_URL +
            "?action=search" +
            "&school=" +
            encodeURIComponent(school) +
            "&month=" +
            encodeURIComponent(month) +
            "&year=" +
            encodeURIComponent(year);


        console.log(
            "MDM SEARCH URL:",
            url
        );


        /* =================================================
           FETCH
        ================================================= */

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow"
                }
            );


        /* =================================================
           READ TEXT
        ================================================= */

        const text =
            await response.text();


        console.log(
            "RAW MDM RESPONSE:",
            text
        );


        /* =================================================
           JSON
        ================================================= */

        let data;

        try{

            data =
                JSON.parse(text);

        }
        catch(error){

            throw new Error(
                "Unable to read response from MDM server."
            );

        }


        console.log(
            "MDM DATA:",
            data
        );


        /* =================================================
           SUCCESS CHECK
        ================================================= */

        if(
            !data ||
            data.status !== "SUCCESS"
        ){

            throw new Error(
                data?.message ||
                "School details not found."
            );

        }


        /* =================================================
           SCHOOL NAME
        ================================================= */

        document
            .getElementById("schoolName")
            .textContent =
                data.school_name ||
                "School";


        /* =================================================
           FINE RICE
        ================================================= */

        document
            .getElementById("riceValue")
            .textContent =
                calculateRice(data) +
                " KG";


        /* =================================================
           JAGGERY
        ================================================= */

        document
            .getElementById("jaggeryValue")
            .textContent =
                calculateJaggery(data) +
                " KG";


        /* =================================================
           RAGI POWDER
        ================================================= */

        const ragiAmount =
            calculateRagi(data);

        document
            .getElementById("ragiValue")
            .textContent =
                ragiAmount +
                " KG";


        /* =================================================
           SHOW RESULT
        ================================================= */

        result.style.display="block";

        downloadBtn.style.display="block";

        anotherBtn.style.display="block";

        status.style.color="#059669";

        status.textContent =
            "✓ Details found successfully.";


    }
    catch(error){

        console.error(
            "MDM SEARCH ERROR:",
            error
        );


        result.style.display="none";

        downloadBtn.style.display="none";

        anotherBtn.style.display="none";

        status.style.color="#dc2626";

        status.textContent =
            error.message ||
            "Unable to retrieve school details.";

    }
    finally{

        searchBtn.disabled=false;

        searchBtn.textContent =
            "🔍 SEARCH DETAILS";

    }

}


/* =========================================================
   CHECK ANOTHER SCHOOL
========================================================= */

function checkAnotherSchool(){

    const schoolInput =
        document.getElementById("school");

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const anotherBtn =
        document.getElementById("anotherBtn");


    /* CLEAR OLD RESULT */

    schoolInput.value="";

    result.style.display="none";

    downloadBtn.style.display="none";

    anotherBtn.style.display="none";

    status.textContent="";

    status.style.color="#2563eb";


    /* FOCUS NEW SEARCH */

    schoolInput.focus();

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("school")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                searchSchool();

            }

        }
    );

</script>

</body>
</html>
