<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AP MDM School Entitlement Search</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

.mdm-container{
    width:100%;
    max-width:620px;
    margin:auto;
    background:#fff;
    border:2px solid #2563eb;
    border-radius:13px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.10);
}

.header{
    padding:12px 10px;
    text-align:center;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
}

.form-area{
    padding:15px;
}

label{
    display:block;
    font-weight:bold;
    margin:7px 0 4px;
    color:#1e293b;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.10);
}

.search-btn{
    width:100%;
    margin-top:13px;
    padding:11px;
    border:0;
    border-radius:8px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#2563eb,#059669);
}

.search-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.status{
    min-height:20px;
    text-align:center;
    margin-top:10px;
    font-size:14px;
    font-weight:bold;
}

.loading-dot{
    display:inline-block;
    width:7px;
    height:7px;
    margin-left:4px;
    border-radius:50%;
    background:#2563eb;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }
    50%{
        opacity:1;
        transform:scale(1);
    }
}

.result{
    display:none;
    margin:0 15px 15px;
    border:2px solid #16a34a;
    border-radius:10px;
    overflow:hidden;
}

.school-name{
    padding:11px;
    text-align:center;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(90deg,#16a34a,#0ea5e9);
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 13px;
    border-top:1px solid #e2e8f0;
    font-weight:bold;
}

.item span:last-child{
    font-size:16px;
}

.rice span:last-child{
    color:#2563eb;
}

.jaggery span:last-child{
    color:#dc2626;
}

.ragi span:last-child{
    color:#16a34a;
}

.download-btn{
    display:none;
    width:calc(100% - 30px);
    margin:0 15px 15px;
    padding:10px;
    border:0;
    border-radius:7px;
    background:#111827;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

@media(max-width:500px){

    body{
        padding:7px;
    }

    .form-area{
        padding:12px;
    }

    .result{
        margin:0 12px 12px;
    }

    .download-btn{
        width:calc(100% - 24px);
        margin:0 12px 12px;
    }

    .header{
        font-size:18px;
    }
}


/* =========================================================
   PRINT
========================================================= */

@media print{

    body{
        background:#fff;
        padding:0;
    }

    .mdm-container{
        max-width:650px;
        border:0;
        box-shadow:none;
    }

    .header,
    .form-area,
    .status,
    .download-btn{
        display:none !important;
    }

    .result{
        display:block !important;
        margin:30px auto;
        border:2px solid #000;
    }

}
</style>
</head>

<body>

<div class="mdm-container">

    <div class="header">
        AP MDM SCHOOL ENTITLEMENT
    </div>

    <div class="form-area">

        <label>UDISE / Institute Code</label>

        <input
            type="text"
            id="school"
            placeholder="Enter UDISE Code"
            inputmode="numeric"
            autocomplete="off"
        >

        <label>Month</label>

        <select id="month">

            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8" selected>September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>

        </select>

        <label>Year</label>

        <select id="year">

            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>

        </select>

        <button
            class="search-btn"
            id="searchBtn"
            onclick="searchSchool()">

            🔍 SEARCH DETAILS

        </button>

        <div
            class="status"
            id="status">
        </div>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">

        <div
            class="school-name"
            id="schoolName">
        </div>

        <div class="item rice">

            <span>🍚 Fine Rice</span>

            <span id="riceValue">
                0 KG
            </span>

        </div>

        <div class="item jaggery">

            <span>🟠 Jaggery</span>

            <span id="jaggeryValue">
                0 KG
            </span>

        </div>

        <div class="item ragi">

            <span>🟢 Ragi Powder</span>

            <span id="ragiValue">
                0 KG
            </span>

        </div>

    </div>


    <button
        class="download-btn"
        id="downloadBtn"
        onclick="window.print()">

        📄 DOWNLOAD / PRINT PDF

    </button>

</div>


<script>

/* =========================================================
   CONFIRMED WORKING APPS SCRIPT URL
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbw3OiS5VGG3J40uGoSsQJrnwqyKN5veUOCe3vdG0AoqsMlsm36Ny-E0FEd2fX6QGvVIVA/exec";


/* =========================================================
   NUMBER
========================================================= */

function num(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =========================================================
   FINE RICE
   API value = number of 25 KG units
========================================================= */

function calculateRice(data){

    const units =
        num(data?.rice?.["01_05"]) +
        num(data?.rice?.["06_08"]) +
        num(data?.rice?.["09_10"]) +
        num(data?.rice?.["11_12"]);

    return units * 25;

}


/* =========================================================
   JAGGERY
========================================================= */

function calculateJaggery(data){

    return (
        num(data?.jaggery?.["01_05"]) +
        num(data?.jaggery?.["06_08"]) +
        num(data?.jaggery?.["09_10"]) +
        num(data?.jaggery?.["11_12"])
    );

}


/* =========================================================
   RAGI POWDER
========================================================= */

function calculateRagi(data){

    return (
        num(data?.ragi?.["01_05"]) +
        num(data?.ragi?.["06_08"]) +
        num(data?.ragi?.["09_10"]) +
        num(data?.ragi?.["11_12"])
    );

}


/* =========================================================
   SEARCH
========================================================= */

async function searchSchool(){

    const schoolInput =
        document.getElementById("school");

    const month =
        document.getElementById("month").value;

    const year =
        document.getElementById("year").value;

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const searchBtn =
        document.getElementById("searchBtn");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const school =
        schoolInput.value.trim();


    /* =====================================================
       VALIDATION
    ===================================================== */

    if(!school){

        status.style.color="#dc2626";

        status.textContent =
            "Please enter UDISE / Institute Code.";

        result.style.display="none";

        downloadBtn.style.display="none";

        schoolInput.focus();

        return;

    }


    /* =====================================================
       VALIDATE UDISE
    ===================================================== */

    if(!/^\d{8,15}$/.test(school)){

        status.style.color="#dc2626";

        status.textContent =
            "Please enter a valid UDISE / Institute Code.";

        result.style.display="none";

        downloadBtn.style.display="none";

        schoolInput.focus();

        return;

    }


    /* =====================================================
       START
    ===================================================== */

    searchBtn.disabled=true;

    searchBtn.textContent="⏳ SEARCHING...";

    result.style.display="none";

    downloadBtn.style.display="none";

    status.style.color="#2563eb";

    status.innerHTML =
        "Connecting to official MDM data" +
        '<span class="loading-dot"></span>';


    try{

        /* =================================================
           CREATE URL
        ================================================= */

        const url =
            API_URL +
            "?action=search" +
            "&school=" +
            encodeURIComponent(school) +
            "&month=" +
            encodeURIComponent(month) +
            "&year=" +
            encodeURIComponent(year);


        console.log(
            "MDM SEARCH URL:",
            url
        );


        /* =================================================
           45 SECOND TIMEOUT
        ================================================= */

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                function(){

                    controller.abort();

                },
                45000
            );


        /* =================================================
           FETCH
        ================================================= */

        status.innerHTML =
            "Reading official MDM data" +
            '<span class="loading-dot"></span>';


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal
                }
            );


        clearTimeout(timeout);


        /* =================================================
           HTTP ERROR
        ================================================= */

        if(!response.ok){

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        /* =================================================
           READ JSON
        ================================================= */

        status.innerHTML =
            "Preparing result" +
            '<span class="loading-dot"></span>';


        const data =
            await response.json();


        console.log(
            "MDM RESPONSE:",
            data
        );


        /* =================================================
           API ERROR
        ================================================= */

        if(data.status !== "SUCCESS"){

            throw new Error(
                data.message ||
                "School details not found."
            );

        }


        /* =================================================
           SCHOOL NAME
        ================================================= */

        document
            .getElementById("schoolName")
            .textContent =
                data.school_name ||
                "School";


        /* =================================================
           FINE RICE
        ================================================= */

        document
            .getElementById("riceValue")
            .textContent =
                calculateRice(data) +
                " KG";


        /* =================================================
           JAGGERY
        ================================================= */

        document
            .getElementById("jaggeryValue")
            .textContent =
                calculateJaggery(data) +
                " KG";


        /* =================================================
           RAGI
        ================================================= */

        document
            .getElementById("ragiValue")
            .textContent =
                calculateRagi(data) +
                " KG";


        /* =================================================
           SHOW RESULT
        ================================================= */

        result.style.display="block";

        downloadBtn.style.display="block";

        status.style.color="#16a34a";

        status.textContent =
            "✓ Details found successfully.";


    }
    catch(error){

        console.error(
            "MDM SEARCH ERROR:",
            error
        );


        result.style.display="none";

        downloadBtn.style.display="none";

        status.style.color="#dc2626";


        if(error.name === "AbortError"){

            status.textContent =
                "Search timed out. Please try again.";

        }
        else{

            status.textContent =
                error.message ||
                "Unable to retrieve school details.";

        }

    }
    finally{

        searchBtn.disabled=false;

        searchBtn.textContent =
            "🔍 SEARCH DETAILS";

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("school")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                searchSchool();

            }

        }
    );

</script>

</body>
</html>
